<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Daily Dribble Newsletter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>The Daily Dribble Newsletter</h1>
        <img class="ball-img" src="basketball.jpg" alt="Close-up of a Basketball">
        <h2>Get the latest 🏀basketball news delivered straight to your inbox.</h2>
        <div class="email-input-wrapper">
            <label for="email">Email:</label>
            <input class="email-input" type="email" id="email" placeholder="Enter your email">
        </div>
        <div class="btn-wrapper">
            <button class="sub-btn">Subscribe</button>
            <button class="btn">Learn More</button>
        </div>
        <br>
        <p>We respect your privacy. Unsubscribe anytime.</p>
    </div>
    </body>
</html>
